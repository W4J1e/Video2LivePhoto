<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实况图 Live Photo 生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdmirror.com/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdmirror.com/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdmirror.com/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        neutral: '#F3F4F6',
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass {
                @apply bg-white/80 backdrop-blur-md border border-white/20;
            }
            .shadow-custom {
                box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.1);
            }
        }
        body {
            background: radial-gradient(circle at top right, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="text-center mb-10">
            <h1 class="text-[clamp(1.8rem,4vw,2.5rem)] font-bold text-gray-800 mb-3">
                <i class="fa fa-camera-retro mr-2"></i>实况图 Live Photo 生成器
            </h1>
            <p class="text-gray-600">将视频转换或合并为动态照片效果</p>
        </header>

        <main class="glass rounded-2xl shadow-custom p-4 md:p-8 mb-8">
            <!-- 上传区域 -->
            <section id="uploadSection" class="mb-8">
                <div id="uploadArea" class="border-2 border-dashed border-gray-200 rounded-xl p-8 md:p-12 text-center cursor-pointer hover:border-primary/50 hover:bg-primary/5 transition-all duration-300 group">
                    <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-6 group-hover:scale-110 transition-transform">
                        <i class="fa fa-cloud-upload text-3xl text-gray-400 group-hover:text-primary transition-colors"></i>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800 mb-2">生成你的实况照片</h3>
                    <p class="text-gray-500 mb-6">支持多种视频格式，支持4k，因浏览器限制，HEVC编码视频不支持剪辑</p>
                    <label class="inline-block bg-primary text-white px-8 py-3 rounded-xl font-medium cursor-pointer hover:bg-primary/90 hover:shadow-lg hover:shadow-primary/20 transition-all active:scale-95">
                        <span>选择视频文件</span>
                        <input type="file" id="fileInput" accept="video/*" class="hidden">
                    </label>
                </div>
            </section>

            <!-- 预览区域 -->
            <section id="previewSection" class="mb-8 hidden animate-in fade-in slide-in-from-bottom-4 duration-500">
                <div class="flex items-center gap-2 mb-6">
                    <div class="w-1.5 h-6 bg-primary rounded-full"></div>
                    <h3 class="text-xl font-bold text-gray-800">编辑与预览</h3>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- 视频预览 -->
                    <div class="space-y-6">
                        <div class="bg-black/5 rounded-xl overflow-hidden aspect-video shadow-inner flex items-center justify-center">
                            <video id="videoPreview" class="w-full h-full object-contain" controls></video>
                        </div>
                        <div class="bg-gray-50 p-4 rounded-xl space-y-4">
                            <div>
                                <div class="flex justify-between mb-2">
                                    <label class="text-sm font-bold text-gray-700">开始时间</label>
                                    <span id="startTimeVal" class="text-xs font-mono text-primary bg-primary/10 px-2 py-0.5 rounded">0.0s</span>
                                </div>
                                <input type="range" id="startTime" min="0" step="0.1" class="w-full h-1.5 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
                            </div>
                            <div>
                                <div class="flex justify-between mb-2">
                                    <label class="text-sm font-bold text-gray-700">结束时间</label>
                                    <span id="endTimeVal" class="text-xs font-mono text-primary bg-primary/10 px-2 py-0.5 rounded">3.0s</span>
                                </div>
                                <input type="range" id="endTime" min="0.1" step="0.1" class="w-full h-1.5 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
                            </div>
                        </div>
                    </div>
                    
                    <!-- 封面预览 -->
                    <div class="space-y-6">
                        <div class="bg-black/5 rounded-xl overflow-hidden aspect-square relative shadow-inner group">
                            <img id="coverPreview" class="w-full h-full object-contain" alt="封面图片">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                <label class="text-white bg-white/20 backdrop-blur-md border border-white/30 px-6 py-2.5 rounded-xl text-sm font-medium hover:bg-white/30 transition-all cursor-pointer">
                                    <i class="fa fa-camera mr-2"></i> 更换封面
                                    <input type="file" id="photoUpload" accept="image/*" class="hidden">
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 处理中区域 -->
            <section id="processingSection" class="mb-8 hidden">
                <h3 class="text-xl font-semibold text-gray-700 mb-4">正在处理...</h3>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="progressBar" class="bg-primary h-2.5 rounded-full" style="width: 0%"></div>
                </div>
                <p id="progressText" class="text-gray-600 mt-2">准备中...</p>
            </section>

            <!-- 结果区域 -->
            <section id="resultSection" class="mb-8 hidden">
                <h3 class="text-xl font-semibold text-gray-700 mb-4">生成成功</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- 左侧预览图 -->
                    <div class="md:col-span-2">
                        <div class="bg-gray-50 rounded-lg p-4">
                            <span id="fileSizeDisplay" class="text-sm text-gray-500 italic block mb-3"></span>
                            <div class="w-full max-w-xs mx-auto">
                                <img id="resultPreview" class="w-full h-auto max-h-64 object-contain rounded-lg shadow-md" alt="动态照片封面">
                                <video id="motionVideoPreview" class="w-full h-auto max-h-64 object-contain rounded-lg shadow-md hidden" controls></video>
                            </div>
                        </div>
                    </div>
                    <!-- 右侧功能按钮 -->
                    <div class="flex flex-col justify-center gap-4">
                        <button id="playVideoBtn" class="bg-secondary text-white px-4 py-3 rounded-lg hover:bg-secondary/90 transition-all active:scale-95 flex items-center justify-center shadow-sm text-base">
                            <i class="fa fa-play mr-2"></i> 播放预览
                        </button>
                        <button id="downloadBtn" class="bg-primary text-white px-4 py-3 rounded-lg hover:bg-primary/90 transition-all active:scale-95 flex items-center justify-center shadow-sm text-base">
                            <i class="fa fa-download mr-2"></i> 下载文件
                        </button>
                        <button id="convertAnotherBtn" class="bg-gray-200 text-gray-700 px-4 py-3 rounded-lg hover:bg-gray-300 transition-colors duration-300 flex items-center justify-center text-base">
                            <i class="fa fa-refresh mr-2"></i> 转换另一张
                        </button>
                    </div>
                </div>
            </section>

            <!-- 格式选择和生成按钮 -->
            <div class="space-y-6">
                <div class="flex flex-col items-center gap-4">
                    <div class="w-full max-w-xs">
                        <label for="format-select" class="block text-sm font-medium text-gray-700 mb-1">输出格式</label>
                        <select id="format-select" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm rounded-lg">
                            <option value="auto">自动选择(推荐)</option>
                            <option value="apple">Apple Live Photo</option>
                            <option value="google">Google Motion Photo</option>
                        </select>
                    </div>
                </div>
                
                <div class="flex justify-center">
                    <button id="generateBtn" class="bg-primary text-white px-8 py-3 rounded-lg text-lg font-medium hover:bg-primary/90 transition-colors duration-300 hidden">
                        <i class="fa fa-magic mr-2"></i> 生成动态照片
                    </button>
                </div>
            </div>
        </main>

        <footer class="text-center text-gray-500 text-sm">
            <p>© 2026 - 实况图 Live Photo 生成器 | <a href="https://hin.cool" target="_blank">By: W4J1e</a> </p>
        </footer>
    </div>

    <!-- 通知提示 -->
    <div id="notification" class="fixed top-4 right-4 p-4 rounded-lg shadow-lg transform transition-all duration-300 opacity-0 translate-y-[-20px] z-50"></div>

    <!-- 第三方库 -->
    <script src="https://cdn.jsdmirror.com/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdmirror.com/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    
    <!-- 核心功能脚本 -->
    <script src="script/core/video-processor.js" type="module"></script>
    <script src="script/core/livephoto-builder.js" type="module"></script>
    
    <!-- 工具类脚本 -->
    <script src="script/utils/ui-helper.js" type="module"></script>
    <script src="script/utils/file-validator.js" type="module"></script>
    
    <!-- 主应用脚本 -->
    <script src="app.js" type="module"></script>
</body>
</html>
